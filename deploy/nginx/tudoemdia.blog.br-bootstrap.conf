# Configuração temporária, só HTTP, para o Certbot emitir o primeiro certificado.
server {
    listen 80;
    listen [::]:80;
    server_name tudoemdia.blog.br www.tudoemdia.blog.br;
    root /var/www/tudoemdia.blog.br/html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tudoemdia.blog.br/html; }
    location / { try_files $uri $uri/index.html =404; }
}
