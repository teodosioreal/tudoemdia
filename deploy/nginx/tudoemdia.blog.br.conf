# Nginx — tudoemdia.blog.br
# Gerado por scripts/set-domain.mjs. Não edite o domínio à mão: rode o script de novo.
# Site estático (Astro) servido de /var/www/tudoemdia.blog.br/html

# --- HTTP -> HTTPS (e desafio do Certbot) -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tudoemdia.blog.br www.tudoemdia.blog.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tudoemdia.blog.br/html;
    }
    location / {
        return 301 https://tudoemdia.blog.br$request_uri;
    }
}

# --- HTTPS no host alternativo -> host canônico ------------------------------
server {
    # Sintaxe compatível com o Nginx do Ubuntu LTS (1.18/1.24)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tudoemdia.blog.br;

    ssl_certificate     /etc/letsencrypt/live/tudoemdia.blog.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudoemdia.blog.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://tudoemdia.blog.br$request_uri;
}

# --- Site --------------------------------------------------------------------
server {
    # Sintaxe compatível com o Nginx do Ubuntu LTS (1.18/1.24)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tudoemdia.blog.br;

    root /var/www/tudoemdia.blog.br/html;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/tudoemdia.blog.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudoemdia.blog.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de segurança. Ficam num arquivo incluído em cada location porque,
    # no Nginx, um add_header dentro de location anula os herdados do server.
    include snippets/tudoemdia.blog.br-security.conf;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;
    # Brotli: descomente se o módulo estiver instalado (apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;

    # URLs com barra final (padrão do site): /pagina -> /pagina/
    rewrite ^([^.]*[^/])$ $1/ permanent;

    location / {
        try_files $uri $uri/index.html =404;
        # HTML: sempre revalidar, para atualizações aparecerem na hora
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include snippets/tudoemdia.blog.br-security.conf;
    }

    # Assets com hash no nome: cache de 1 ano
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/tudoemdia.blog.br-security.conf;
        access_log off;
        try_files $uri =404;
    }

    # Imagens e ícones estáveis
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        include snippets/tudoemdia.blog.br-security.conf;
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap-index.xml { add_header Cache-Control "public, max-age=3600"; include snippets/tudoemdia.blog.br-security.conf; }
    location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; include snippets/tudoemdia.blog.br-security.conf; }
    location = /ads.txt           { add_header Cache-Control "public, max-age=3600"; include snippets/tudoemdia.blog.br-security.conf; }

    # Bloqueia arquivos ocultos (.git, .env etc.)
    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
